<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f5f8f5" />
		<title>NutriCalc — Offline</title>
		<link rel="stylesheet" href="/style.css" />
	</head>
	<body>
		<main class="offline-page">
			<div class="offline-card">
				<div class="offline-mark" aria-hidden="true">＋</div>
				<p class="section-kicker">NUTRICALC</p>
				<h1>You’re offline</h1>
				<p>NutriCalc couldn’t load the app shell from this device. Reconnect once to finish caching the app, then it will be ready offline.</p>
				<button class="button button-primary" type="button" onclick="location.reload()">Try again</button>
			</div>
		</main>
	</body>
</html>
